[project]
name = "bot_detection"
version = "0.1.0"
description = "bot_detection using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.1"
]

[project.scripts]
bot_detection = "bot_detection.main:run"
run_crew = "bot_detection.main:run"
train = "bot_detection.main:train"
replay = "bot_detection.main:replay"
test = "bot_detection.main:test"
run_with_trigger = "bot_detection.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
