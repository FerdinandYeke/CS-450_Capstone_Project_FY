[project]
name = "bot_flow"
version = "0.1.0"
description = "bot_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.8.1",
    "litellm>=1.75.3",
    "oxylabs>=2.0.0",
]

[project.scripts]
kickoff = "bot_flow.main:kickoff"
run_crew = "bot_flow.main:kickoff"
plot = "bot_flow.main:plot"
run_with_trigger = "bot_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_flow"]

[tool.crewai]
type = "flow"
