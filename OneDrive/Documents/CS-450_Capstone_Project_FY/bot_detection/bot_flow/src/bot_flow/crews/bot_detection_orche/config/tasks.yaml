research_task:
  description: >
    Research about {topic} while applying that knowledge to the website: {website_URL}, web type: {web_type}, and bot type {bot_detect_type}.
    Your research task should: 

    1. Conduct a thorough research about {topic} and {bot_detect_type}.
    2. Make sure you find any interesting and vital information given
    3. The current year is {current_year}.
    4. The current date is {current_date}.
    5. Finalize a report for the other agents, where the report is a list of 10 bullet points of the most relevant info about {topic}, {web_type}, {bot_detect_type}, and {website_URL} together in one report
    with infomation as well of the {bot_detect_type} in {website_URL}. You may also list some sources as well.
  expected_output: >
    A list with 10 bullet points of the most relevant information about {website_URL} based on your research on {topic}, {web_type}, and {bot_detect_type}. Give 
    context of what you have gathered to the {topic} Context Pattern Seeker so that they have an introduction for their task.
  agent: researcher

reporting_task:
  description: >
    Review the output from the {topic} Context Pattern Seeker and expand each topic into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
    Make sure to do the analysis on the website URL {website_URL} instead of creating simulated data.
    Current Year: {current_year}
    Current Date: {current_date}

    Your reporting task should:
    1. Once the {topic} Context Pattern Agent is done with their task, review the output of the {topic} Context Patter Seeker Agent and 
    build a report on their findings while also looking at the {website_URL} on the {bot_detect_type}. Keep in mind that the current year is {current_year}, and the date is {current_date}.
    2. You must have the report done on a markdown while having a visual graph on their findings. You may use tools that aid in building a visual graph such as matplotlib from Python.

  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: reporting_analyst
  output_file: report.md

context_pattern_task:
  description: >
    Detect any bot related activity in the {website_URL}
    Perform a pattern seeking task of detecting bots type {bot_detect_type} in the website URL {website_URL} based on HTML Requests and HTML elements of the webpage.
    Bot Type: {bot_detect_type}
    Website URL: {website_URL}
    Current Date: {current_date}

    Your context pattern task should:
    1. Take the results from the {topic} Senior Data Researcher and use the knowledge for your task.
    2. Receive website URL {website_URL} from the user's input (Keep in mind that the current date is {current_date}).
    3. Check and ask the user whether the website is a Social Media Site or a E-Commerce Site {web_type}.
    4. See the {bot_detect_type}. Does the user want to check good bots, or bad/malicious bots of the given site?
    5. Knowing the bot type {bot_detect_type} of bot they want to detect, know characteristics of {bot_detect_type} behavior from the {topic} Senior Data Researcher.
    6. When taking the characteristics of bot behavior into consideration (THIS IS THE MOST CRUCIAL STEP!!!!), see any patterns in the {website_URL} regarding user behavior possibly being nonhuman (bot) behavior. Take steps A or B based on the website type {web_type}.
      A. If the site type {web_type} is e-commerce, see PATTERNS that show potential bot activity, like instant purchases and/or instant website navigation of the site. Once you see these patterns, report that information to the reporting_analyst.
         Use the scraper tool to look at the {website_URL} HTML requests and see if they are too fast. Use the FULL HTML content as well. If they are, check what activites they are doing that may fit the {bot_detect_type} description.
      B. If the site is a {web_type} is social_media, see PATTERNS that show potential bot activity in the site type, like comments copied from other users where profile seems suspicious, scams, and
      or damaging material. The goal of the scraper tool for the website page {website_URL} is to check any HTML elements of the page that may be repeats of something, like from a commenter in the website URL {website_URL} comment section. 
      Keep the frequency of the scaping operation low but containing important information. Collect any data of the given webpage that may fit characteristics of {bot_detect_type}. Use the FULL HTML content as well.
      Once you see these patterns, report that information to the reporting_analyst.

      * In this step 6, YOU MUST Scrape HTTP Requests and HTTPs from the website {website_URL} With the Scraper tool. 
      * Check any extremely fast rates of HTTP Requests that seems to fast from a human user.
      * Also check and see any things in website page and see any elements from the page (like a comment) that seems in character of {bot_detect_type}.
      * Again, you MUST use the scaper tools for your bot detection activites of {bot_detect_type}, since the goal of the scaper is to look at HTTP elements and requests of the specific given webpage of {web_type} to see any behavior mimicking human behavor.

    7. Once done, make sure to record the details and count of the bots and the details of the bots,
      such as the details of their activities. Check if there any patterns that further show bot related activites.
      Also, give a summarized count of the potential bots {bot_detect_type} of the site as well.
    
    Once you are done with all the steps, request the {topic} reporting analyst 
    to make a markdown file with the most relevant information while requesting it to also generate a graphical stat charts of the bots count of the site.
  expected_output: >
    Professionally detect if there are any potential bots in a web traffic with a given website url {website_URL}, while notifying the {topic} Reporting Analyst of your findings.
  agent: context_pattern_agent